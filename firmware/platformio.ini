; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; can reduce this if there are issues
upload_speed = 921600

; The Arduino-ESP32 framework injects -std=gnu++11, which overrides anything we
; add. Strip it first, then set our own standard so C++17 is actually applied.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I ../shared

lib_ldf_mode = deep+

; Host-native environment for testing hardware-independent logic (mixer, PID,
; state machines, the link parser) with no ESP32 present. See
; docs/current_devtasks.md Phase 0 and docs/control_loop.md "Testing without
; flying". src/main.cpp is excluded because it depends on Arduino.h, which
; does not exist here.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I ../shared
build_src_filter =
    +<*>
    -<main.cpp>
