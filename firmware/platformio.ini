; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

; can reduce this if there are issues
upload_speed = 921600

; The Arduino-ESP32 framework injects -std=gnu++11, which overrides anything we
; add. Strip it first, then set our own standard so C++17 is actually applied.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I ../shared

lib_ldf_mode = deep+

; tools/ holds single-purpose bring-up sketches, each with its own setup()/
; loop(). They must never be linked into the vehicle firmware alongside
; main.cpp -- two definitions of setup() is a link error at best.
build_src_filter =
    +<*>
    -<tools/>

; Bring-up only: ICM-20948 SPI self-test. Replaces main.cpp entirely, drives
; nothing but the IMU, and touches no ESC pin -- safe to run with the 4-in-1
; disconnected. See src/tools/imu_selftest.cpp.
[env:imu_test]
extends = env:esp32dev
build_src_filter =
    +<*>
    -<main.cpp>
    -<tools/>
    +<tools/imu_selftest.cpp>

; Host-native environment for testing hardware-independent logic (mixer, PID,
; state machines, the link parser) with no ESP32 present. See
; docs/current_devtasks.md Phase 0 and docs/control_loop.md "Testing without
; flying". main.cpp and hal/ are excluded because both depend on Arduino.h,
; which does not exist here — hal/ is the seam that isolates that dependency,
; and this filter is what actually keeps it isolated. Any future
; hardware-dependent source (Phase 2 drivers) needs the same exclusion added
; here.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I ../shared
build_src_filter =
    +<*>
    -<main.cpp>
    -<hal/>
    -<tools/>
