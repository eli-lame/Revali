; PlatformIO Project Configuration File — Revali controller (transmitter)
;
; Mirrors firmware/platformio.ini. Two controller forms share this project:
;   6a — the reference joystick controller
;   6b — the DS4/SCUF gamepad ground dongle
; See docs/current_devtasks.md Phase 6 and docs/architecture.md.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; The Arduino-ESP32 framework injects -std=gnu++11, which overrides anything we
; add. Strip it first, then set our own standard so C++17 is actually applied.
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -I ../shared

lib_ldf_mode = deep+
